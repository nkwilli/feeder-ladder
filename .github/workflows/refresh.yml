name: Refresh data
on:
  schedule: [{cron: "17 */3 * * *"}]   # every 3h; well under Jolpica's 500 req/hr
  workflow_dispatch:
permissions: {contents: write}
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with: {path: .cache, key: api-cache-${{ github.run_id }}, restore-keys: api-cache-}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python scripts/refresh.py
        env: {BLACKTOP_API_KEY: "${{ secrets.BLACKTOP_API_KEY }}"}
      - run: |
          git config user.name "data-bot"; git config user.email "data-bot@users.noreply.github.com"
          git add site/data site/cal && git commit -m "Refresh data" || echo "no changes"
          git push
