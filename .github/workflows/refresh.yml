name: Refresh data and deploy
on:
  schedule: [{cron: "17 */3 * * *"}]   # every 3h; well under Jolpica's 500 req/hr
  push: {branches: [main]}
  workflow_dispatch:
permissions: {contents: write, pages: write, id-token: write}
concurrency: {group: pages, cancel-in-progress: false}
jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: "${{ steps.deploy.outputs.page_url }}"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: .cache
          key: "api-cache-${{ github.run_id }}"
          restore-keys: api-cache-
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python scripts/refresh.py
        env:
          BLACKTOP_API_KEY: "${{ secrets.BLACKTOP_API_KEY }}"
      - run: |
          git config user.name "data-bot"; git config user.email "data-bot@users.noreply.github.com"
          git add site/data site/cal && git commit -m "Refresh data [skip ci]" && git push || echo "no changes"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: {path: site}
      - id: deploy
        uses: actions/deploy-pages@v4
